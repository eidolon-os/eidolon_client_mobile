name: eidolon_client_mobile
description: Eidolon cross-platform mobile client demo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  # Tells this phone when its own network changed, so a saved Host's address
  # can be looked up again instead of being discovered stale by paying a
  # timeout for it. Not a reachability check: what it reports is that the last
  # address may no longer lead anywhere, never that the Host is gone.
  #
  # Already in the tree — livekit_client depends on it — so this is a direct
  # constraint on something that was being shipped anyway, and it is pinned to
  # livekit's major so the two cannot ask for different copies.
  connectivity_plus: ^7.0.0
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Choosing the picture an Eidolon wears. Asked to hand back a bounded JPEG
  # rather than the original: the face is a conditioning image for a digital
  # human, so a phone camera's full-resolution photograph is both useless to it
  # and larger than the pinned transport will carry.
  image_picker: ^1.1.2
  livekit_client: ^2.8.1
  # Plays the companion's offline-generated idle-loop clip (served by hub) as the
  # resting placeholder — an mp4 over HTTP, which LiveKit's VideoTrackRenderer
  # (WebRTC tracks only) can't play.
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
